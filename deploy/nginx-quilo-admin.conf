# Nginx vhost for the Laravel admin panel.
# Copy to /etc/nginx/sites-available/quilo-admin, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
# After this, run certbot to add HTTPS.

server {
    listen 80;
    server_name admin.yourdomain.com;       # <-- change to your admin domain

    root /var/www/quilo/school-erp-admin/public;   # <-- Laravel public/ folder
    index index.php index.html;

    client_max_body_size 15M;   # banner/logo/assignment uploads

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (PHP 8.2)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Serve uploaded files via the storage symlink (php artisan storage:link)
    location /storage {
        try_files $uri =404;
    }

    # Block dotfiles except ACME challenge
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/quilo-admin.access.log;
    error_log  /var/log/nginx/quilo-admin.error.log;
}
