; Laravel queue worker for the admin (notifications, exports, etc.).
; Copy to /etc/supervisor/conf.d/quilo-queue.conf then:
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start quilo-queue:*

[program:quilo-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/quilo/school-erp-admin/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/quilo/school-erp-admin
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/quilo/school-erp-admin/storage/logs/queue.log
stopwaitsecs=3600
